# ═══════════════════════════════════════════════════════════════
# application-cloudrun.properties
# Profile for Google Cloud Run + Neon Postgres.
# NO SECRETS LIVE HERE. Everything sensitive is injected by Cloud Run
# as environment variables (plain env vars or Secret Manager).
# Activate with:  SPRING_PROFILES_ACTIVE=cloudrun
# ═══════════════════════════════════════════════════════════════

# ---- Server ----
# Cloud Run injects PORT (defaults to 8080). Must bind 0.0.0.0.
server.port=${PORT:8080}
server.address=0.0.0.0

spring.application.name=aquaflow-mpesa-service

# ---- R2DBC (reactive runtime connection to Neon) ----
# R2DBC_URL example:
#   r2dbc:postgresql://ep-cool-name-123456.eu-central-1.aws.neon.tech:5432/neondb?sslMode=require
spring.r2dbc.url=${R2DBC_URL}
spring.r2dbc.username=${DB_USERNAME}
spring.r2dbc.password=${DB_PASSWORD}

# Keep the pool small — Cloud Run scales horizontally and Neon has
# connection limits. 5 per instance is plenty for this service.
spring.r2dbc.pool.enabled=true
spring.r2dbc.pool.initial-size=1
spring.r2dbc.pool.max-size=5
spring.r2dbc.pool.max-idle-time=30m
spring.r2dbc.pool.validation-query=SELECT 1

# ---- Flyway (migrations run over JDBC, not R2DBC) ----
# Use the DIRECT (non-pooled) Neon host here — migrations use locks/DDL.
# FLYWAY_URL example:
#   jdbc:postgresql://ep-cool-name-123456.eu-central-1.aws.neon.tech:5432/neondb?sslmode=require
spring.flyway.url=${FLYWAY_URL}
spring.flyway.user=${DB_USERNAME}
spring.flyway.password=${DB_PASSWORD}
spring.flyway.enabled=true
# false = fresh empty DB (Flyway builds everything from V1).
# Set to true ONLY if you first restore existing data into Neon.
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE:false}

# ---- Jackson ----
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# ---- Daraja / M-Pesa (ALL from env — no defaults, no secrets) ----
daraja.base-url=${DARAJA_BASE_URL:https://api.safaricom.co.ke}
daraja.consumer-key=${DARAJA_CONSUMER_KEY}
daraja.consumer-secret=${DARAJA_CONSUMER_SECRET}

# C2B
daraja.c2b.shortcode=${DARAJA_C2B_SHORTCODE}
daraja.c2b.confirmation-url=${DARAJA_C2B_CONFIRMATION_URL}
daraja.c2b.validation-url=${DARAJA_C2B_VALIDATION_URL}

# B2B
daraja.b2b.initiator-name=${DARAJA_B2B_INITIATOR}
daraja.b2b.security-credential=${DARAJA_B2B_SECURITY_CREDENTIAL}
daraja.b2b.sender-shortcode=${DARAJA_B2B_SENDER_SHORTCODE}
daraja.b2b.receiver-shortcode=${DARAJA_B2B_RECEIVER_SHORTCODE}
daraja.b2b.queue-timeout-url=${DARAJA_B2B_TIMEOUT_URL}
daraja.b2b.result-url=${DARAJA_B2B_RESULT_URL}
daraja.b2b.disbursement-percentage=${DARAJA_B2B_DISBURSEMENT_PCT:50}

# STK Push
daraja.stk.shortcode=${STK_SHORTCODE}
daraja.stk.passkey=${STK_PASSKEY}
daraja.stk.callback-url=${STK_CALLBACK_URL}

# ---- Water tariff (safe, non-secret business config) ----
aquaflow.water-tariff.tier1-limit=6
aquaflow.water-tariff.tier1-rate=45
aquaflow.water-tariff.tier2-limit=20
aquaflow.water-tariff.tier2-rate=55
aquaflow.water-tariff.tier3-limit=50
aquaflow.water-tariff.tier3-rate=70
aquaflow.water-tariff.tier4-rate=80

# ---- Swagger ----
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ---- Logging ----
logging.level.com.aquaflow=INFO
logging.level.org.springframework.web=INFO
