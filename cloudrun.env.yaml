# ═══════════════════════════════════════════════════════════════
# cloudrun.env.yaml
# All environment variables Cloud Run injects into the container.
# Fill in every <PLACEHOLDER>. Do NOT commit this file to git.
# (Do NOT add PORT — Cloud Run sets it automatically and rejects it here.)
#
# Deploy reads this via:  gcloud run deploy --env-vars-file cloudrun.env.yaml
# ═══════════════════════════════════════════════════════════════

SPRING_PROFILES_ACTIVE: "cloudrun"

# ---- Neon database ----
# Get these from the Neon dashboard "Connection Details".
# Use the DIRECT host for FLYWAY_URL (the one WITHOUT "-pooler").
# You may use the same direct host for R2DBC_URL too.
R2DBC_URL: "r2dbc:postgresql://<NEON_HOST>:5432/<DB_NAME>?sslMode=require"
FLYWAY_URL: "jdbc:postgresql://<NEON_HOST>:5432/<DB_NAME>?sslmode=require"
DB_USERNAME: "<NEON_USER>"
DB_PASSWORD: "<NEON_PASSWORD>"
FLYWAY_BASELINE: "false"

# ---- Daraja base ----
DARAJA_BASE_URL: "https://api.safaricom.co.ke"
DARAJA_CONSUMER_KEY: "<ROTATED_CONSUMER_KEY>"
DARAJA_CONSUMER_SECRET: "<ROTATED_CONSUMER_SECRET>"

# ---- C2B ----
DARAJA_C2B_SHORTCODE: "4010159"
DARAJA_C2B_CONFIRMATION_URL: "https://<CLOUD_RUN_URL>/api/v1/c2b/confirmation"
DARAJA_C2B_VALIDATION_URL: "https://<CLOUD_RUN_URL>/api/v1/c2b/validation"

# ---- B2B ----
DARAJA_B2B_INITIATOR: "ISSANDRO7221"
DARAJA_B2B_SECURITY_CREDENTIAL: "<ROTATED_SECURITY_CREDENTIAL>"
DARAJA_B2B_SENDER_SHORTCODE: "4010159"
DARAJA_B2B_RECEIVER_SHORTCODE: "150770"
DARAJA_B2B_TIMEOUT_URL: "https://<CLOUD_RUN_URL>/api/v1/b2b/timeout"
DARAJA_B2B_RESULT_URL: "https://<CLOUD_RUN_URL>/api/v1/b2b/result"
DARAJA_B2B_DISBURSEMENT_PCT: "50"

# ---- STK Push ----
STK_SHORTCODE: "4010159"
STK_PASSKEY: "<ROTATED_STK_PASSKEY>"
STK_CALLBACK_URL: "https://<CLOUD_RUN_URL>/api/v1/callback"
